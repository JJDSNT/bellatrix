##begin config
version 0.1
residentpri 87
libbase BTUARTBase
libbasetype struct BTUARTBase
##end config
##begin cdef
#define BTUART_API_VERSION 1

/* Capabilities are zero until the corresponding hardware path is safe. */
#define BTUART_CAP_PRESENT       (1UL << 0)
#define BTUART_CAP_RX_INTERRUPT  (1UL << 1)
#define BTUART_CAP_TX_INTERRUPT  (1UL << 2)
#define BTUART_CAP_BAUD_CHANGE   (1UL << 3)
#define BTUART_CAP_POWER_CONTROL (1UL << 4)

#define BTUART_CONFIG_RTS_CTS    (1UL << 0)

#define BTUART_OK                 0
#define BTUART_ERR_ARGUMENT      -1
#define BTUART_ERR_UNAVAILABLE   -2
#define BTUART_ERR_BUSY          -3
#define BTUART_ERR_NOT_OWNER     -4
#define BTUART_ERR_TIMEOUT       -5
##end cdef
##begin cdefprivate
#include "btuart_private.h"
##end cdefprivate
##begin functionlist
unsigned int BTUARTGetAPIVersion() ()
unsigned long BTUARTGetCapabilities() ()
long BTUARTClaim(void *owner) (A0)
void BTUARTRelease(void *owner) (A0)
long BTUARTConfigure(void *owner, unsigned long baud, unsigned long flags) (A0, D0, D1)
long BTUARTSetPower(void *owner, unsigned long enabled) (A0, D0)
long BTUARTWrite(void *owner, const void *data, unsigned long length) (A0, A1, D0)
long BTUARTRead(void *owner, void *data, unsigned long capacity) (A0, A1, D0)
##end functionlist

name: Release images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: musashi
            release_profile: musashi_68000
            musashi_cpu: "68000"
            multicore: "0"
            build_dir: emu68/build-bellatrix-rigel-musashi
            install_dir: emu68/install-bellatrix-rigel-musashi
            image: bellatrix_musashi_68000.img
            expected_backend: musashi
          - backend: musashi
            release_profile: musashi_68040
            musashi_cpu: "68040"
            multicore: "0"
            build_dir: emu68/build-bellatrix-rigel-musashi
            install_dir: emu68/install-bellatrix-rigel-musashi
            image: bellatrix_musashi_68040.img
            expected_backend: musashi
          - backend: emu68
            release_profile: emu68
            musashi_cpu: "68040"
            multicore: "0"
            build_dir: emu68/build-bellatrix-rigel
            install_dir: emu68/install-bellatrix-rigel
            image: bellatrix_emu68.img
            expected_backend: "emu68"
          - backend: musashi
            release_profile: musashi_68000
            musashi_cpu: "68000"
            multicore: "1"
            build_dir: emu68/build-bellatrix-rigel-musashi
            install_dir: emu68/install-bellatrix-rigel-musashi
            image: bellatrix_musashi_68000_multicore.img
            expected_backend: musashi
          - backend: musashi
            release_profile: musashi_68040
            musashi_cpu: "68040"
            multicore: "1"
            build_dir: emu68/build-bellatrix-rigel-musashi
            install_dir: emu68/install-bellatrix-rigel-musashi
            image: bellatrix_musashi_68040_multicore.img
            expected_backend: musashi
          - backend: emu68
            release_profile: emu68
            musashi_cpu: "68040"
            multicore: "1"
            build_dir: emu68/build-bellatrix-rigel
            install_dir: emu68/install-bellatrix-rigel
            image: bellatrix_emu68_multicore.img
            expected_backend: "emu68"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            make \
            python3

      - name: Prepare submodules
        run: ./scripts/setup.sh

      - name: Build release image
        env:
          BELLATRIX_CHIPSET_BACKEND: rigel
          BELLATRIX_RELEASE_PROFILE: ${{ matrix.release_profile }}
          BELLATRIX_CPU_BACKEND: ${{ matrix.backend }}
          BELLATRIX_MUSASHI_CPU: ${{ matrix.musashi_cpu }}
          BELLATRIX_MULTICORE_BUILD: ${{ matrix.multicore }}
          BELLATRIX_BTSTACK: "1"
          BELLATRIX_HDMI_AUDIO: "1"
          BELLATRIX_USBSTACK: "1"
          BELLATRIX_USB_MSC: "1"
        run: ./scripts/build.sh clean

      - name: Prepare image artifact
        run: |
          set -euo pipefail
          mkdir -p dist

          cp "${{ matrix.install_dir }}/Emu68.img" "dist/${{ matrix.image }}"
          if ! grep -aF "[BELA] CPU backend: ${{ matrix.expected_backend }}" "dist/${{ matrix.image }}" >/dev/null; then
            echo "ERROR: ${{ matrix.image }} does not contain expected CPU backend marker: ${{ matrix.expected_backend }}"
            grep -aF "[BELA] CPU backend:" "dist/${{ matrix.image }}" || true
            exit 1
          fi
          if [ "${{ matrix.backend }}" = "musashi" ] &&
             ! grep -F "BELLATRIX_MUSASHI_CPU:STRING=${{ matrix.musashi_cpu }}" \
               "${{ matrix.build_dir }}/CMakeCache.txt" >/dev/null; then
            echo "ERROR: ${{ matrix.image }} was not configured as Musashi ${{ matrix.musashi_cpu }}"
            exit 1
          fi
          if ! grep -F "BELLATRIX_ENABLE_SDCARD_BOARD:BOOL=ON" \
               "${{ matrix.build_dir }}/CMakeCache.txt" >/dev/null; then
            echo "ERROR: ${{ matrix.image }} does not include the mandatory SD card board"
            exit 1
          fi
          case "${{ matrix.release_profile }}" in
            emu68)
              expected_68040=ON; expected_dt=ON; expected_rtg=1 ;;
            musashi_68040)
              expected_68040=OFF; expected_dt=ON; expected_rtg=1 ;;
            musashi_68000)
              expected_68040=OFF; expected_dt=OFF; expected_rtg=0 ;;
          esac
          grep -F "BELLATRIX_ENABLE_68040_BOARD:BOOL=$expected_68040" \
            "${{ matrix.build_dir }}/CMakeCache.txt" >/dev/null
          grep -F "BELLATRIX_ENABLE_DEVICETREE_BOARD:BOOL=$expected_dt" \
            "${{ matrix.build_dir }}/CMakeCache.txt" >/dev/null
          if [ "$expected_rtg" = 1 ]; then
            card="${{ matrix.install_dir }}/VideoCore/VideoCore.card"
            test -f "$card"
            card_artifact="${{ matrix.image }}.VideoCore.card"
            cp "$card" "dist/$card_artifact"
          elif [ -e "${{ matrix.install_dir }}/VideoCore/VideoCore.card" ]; then
            echo "ERROR: Musashi 68000 release unexpectedly contains VideoCore.card"
            exit 1
          fi
          (
            cd dist
            sha256sum "${{ matrix.image }}" > "${{ matrix.image }}.sha256"
            if [ "$expected_rtg" = 1 ]; then
              sha256sum "$card_artifact" > "$card_artifact.sha256"
            fi
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}
          path: |
            dist/*.img
            dist/*.VideoCore.card
            dist/*.sha256

  publish-release:
    name: Publish release assets
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all image artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            release_flags=()
            case "$TAG_NAME" in
              *-rc*|*-beta*|*-test*)
                release_flags+=(--prerelease --latest=false)
                ;;
            esac

            notes_flags=()
            notes_file=".github/release-notes/${TAG_NAME}.md"
            if [ -f "$notes_file" ]; then
              notes_flags+=(--notes-file "$notes_file")
            fi

            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --generate-notes \
              "${release_flags[@]}" \
              "${notes_flags[@]}"
          fi

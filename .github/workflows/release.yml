name: Release

# The same release that scripts/release.sh produces on a workstation, produced
# on a runner instead. The script is the release: this workflow only arranges
# for it to have a toolchain, and calls it.
#
# Whether a hosted runner can do this at all is still an open question --
# build-aros.sh full has to finish inside six hours and fit in the runner's
# disk, and neither number is measured yet (ISSUE-0022). Until it is, run this
# with dry_run and read the timings before trusting it with a tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
      dry_run:
        description: "Build and verify, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    # glibc 2.38: the cached toolchain does not start on 22.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # release notes compare against the previous tag

      - name: Reclaim disk
        # The build tree is ~8 GB and the runner ships with several gigabytes of
        # toolchains this build never touches.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cmake flex bison gperf \
            python3 mtools ccache

      - name: Apply the patch series
        run: ./scripts/setup.sh

      - name: Work out the toolchain key
        id: key
        # Asked of the script rather than recomputed here. It used to be
        # duplicated in YAML, which is how one pipefail bug came to live in
        # three files at once.
        run: |
          echo "key=$(./scripts/build-aros.sh --toolchain-key)" >> "$GITHUB_OUTPUT"
          echo "digest=$(./scripts/build-aros.sh --toolchain-key | cut -d- -f1)" >> "$GITHUB_OUTPUT"

      # Tier one: the native cache. Fastest when it is there, gone after seven
      # idle days, which is why it is not the only tier.
      - name: Restore the toolchain from the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/build/aros/bin/*/tools/crosstools
          key: toolchain-${{ steps.key.outputs.key }}

      # Tier two: the asset the toolchain workflow published. Durable, and the
      # reason a release never has to compile gcc by surprise.
      - name: Restore the toolchain from its release
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key='${{ steps.key.outputs.key }}'
          tag="toolchain-${{ steps.key.outputs.digest }}"
          if gh release download "$tag" -p "$key.tar.xz" -p "$key.tar.xz.sha256" 2>/dev/null; then
            sha256sum -c "$key.tar.xz.sha256"
            mkdir -p out/build/aros/bin/linux-x86_64/tools
            tar -C out/build/aros/bin/linux-x86_64/tools -xJf "$key.tar.xz"
            rm -f "$key.tar.xz" "$key.tar.xz.sha256"
            echo "restored $key from $tag"
          else
            echo "::warning::no cached toolchain for $key — this run compiles gcc from source, which takes hours. Run the Cross toolchain workflow first."
          fi

      - name: Save the toolchain to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/build/aros/bin/*/tools/crosstools
          key: toolchain-${{ steps.key.outputs.key }}

      - name: State of the build
        run: ./scripts/build-aros.sh --status

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          BELLATRIX_BUILD_YES: "1"   # a missing toolchain must not stop on a prompt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ./scripts/release.sh "${{ inputs.tag }}" --dry-run
          else
            ./scripts/release.sh "${{ inputs.tag }}"
          fi

      - name: Keep the assets whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bellatrix-${{ inputs.tag }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 14
